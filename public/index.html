<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="The Rabbit Hole — an Ink-powered interactive narrative game.">
  <title>The Rabbit Hole — Ink Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">INK / RABBIT HOLE / PLAYABLE BUILD</p>
        <h1>The Rabbit Hole</h1>
        <p class="dek">Three rooms. Three records. One connected story. Enter a room, watch the source material, make choices, and carry what you discover back into the corridor.</p>
      </div>
      <div class="status"><span class="dot"></span><span>INK LIVE</span></div>
    </header>

    <section id="game" class="game" aria-live="polite">
      <div class="loading">Loading the Ink story…</div>
    </section>

    <footer>
      <span>INK SOURCE: ink/rabbit-hole.ink</span>
      <span>COMPILED WITH INKJS</span>
    </footer>
  </main>
  <script src="inkjs.js"></script>
  <script type="module" src="app.js?v=20260926-1"></script>
</body>
</html>
